name: Muxify
options:
  bundleIdPrefix: dev.muxify
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
packages:
  MuxifyCore:
    path: Packages/MuxifyCore
  MuxifyCLI:
    path: .
targets:
  Muxify:
    type: application
    platform: macOS
    sources:
      - path: Sources/Muxify
      - path: Resources/AppIcon.icon
        buildPhase: resources
      # Program logos for Window and Agent rows, named after the command
      # (or Agent) they stand for.
      - path: Resources/Logos
        buildPhase: resources
      - path: Resources/ThirdPartyNotices
        type: folder
        buildPhase: resources
      # A folder reference keeps the layout, so the bundled install.sh finds
      # the Extension files next to it (Contents/Resources/extensions/...).
      - path: extensions
        type: folder
        buildPhase: resources
    info:
      path: Resources/Info.plist
      properties:
        CFBundleName: Muxify
        CFBundleDisplayName: Muxify
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "14.0"
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHighResolutionCapable: true
        NSPrincipalClass: NSApplication
        NSLocalNetworkUsageDescription: Programs you run in Muxify connect to servers and containers on your local network.
        CFBundleURLTypes:
          - CFBundleURLName: dev.muxify.shell
            CFBundleURLSchemes: [muxify]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_NAME: Muxify
        # APFS ignores case, so a Contents/MacOS/Muxify that reaches a Pane's
        # PATH runs as `muxify`: a second app that never exits, not the CLI.
        EXECUTABLE_NAME: MuxifyApp
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        PRODUCT_BUNDLE_IDENTIFIER: dev.muxify.shell
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_INCLUDE_PATHS: $(PROJECT_DIR)/vendor/ghostty/include
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Muxify/Muxify-Bridging-Header.h
        LIBRARY_SEARCH_PATHS: $(PROJECT_DIR)/vendor/ghostty/lib
        OTHER_LDFLAGS: "-lghostty -lc++ -framework Carbon"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        DEAD_CODE_STRIPPING: YES
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - package: MuxifyCore
      - target: MuxifyCLITool
        link: false
        embed: false
    scheme:
      testTargets:
        - MuxifyTests
        - package: MuxifyCore/MuxifyCoreTests
        - package: MuxifyCLI/MuxifyCLITests
    postBuildScripts:
      # Copy the CLI into Contents/Resources/bin/muxify; the app's
      # Install Command Line Tool action links it into ~/.local/bin.
      - name: Bundle Muxify CLI
        script: "/bin/sh \"$PROJECT_DIR/scripts/bundle-cli.sh\""
        basedOnDependencyAnalysis: false
      - name: Bundle Ghostty resources
        script: "\"$PROJECT_DIR/scripts/bundle-ghostty-resources.sh\""
        basedOnDependencyAnalysis: false
  # Compile app code directly into an unhosted test bundle. Native-window tests
  # do not start Ghostty or attach to the user's tmux.
  MuxifyTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Sources/Muxify
        excludes: [App/MuxifyApp.swift]
      - path: Tests/MuxifyTests
    dependencies:
      - package: MuxifyCore
      - package: MuxifyCore
        product: MuxifyTestSupport
      # ExtensionCommandTests runs the real CLI.
      - target: MuxifyCLITool
        link: false
        embed: false
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        SWIFT_INCLUDE_PATHS: $(PROJECT_DIR)/vendor/ghostty/include
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Muxify/Muxify-Bridging-Header.h
        LIBRARY_SEARCH_PATHS: $(PROJECT_DIR)/vendor/ghostty/lib
        OTHER_LDFLAGS: "-lghostty -lc++ -framework Carbon"
  # The CLI, built in the same Xcode build as the app, so MuxifyCore compiles once.
  # The package's own MuxifyCLIMain builds the same binary for `swift build`.
  MuxifyCLITool:
    type: tool
    platform: macOS
    sources:
      - path: Sources/MuxifyCLIMain
    dependencies:
      - package: MuxifyCLI
        product: MuxifyCLI
    settings:
      base:
        # Package tests also build `muxify`. Use a distinct intermediate name;
        # bundle-cli.sh installs this tool into the app as bin/muxify.
        PRODUCT_NAME: muxify-app-cli
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
